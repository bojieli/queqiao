plugins {
    id "com.android.application"
}

def releaseSigning = [
        storeFile    : System.getenv("QUEQIAO_ANDROID_STORE_FILE"),
        storePassword: System.getenv("QUEQIAO_ANDROID_STORE_PASSWORD"),
        keyAlias     : System.getenv("QUEQIAO_ANDROID_KEY_ALIAS"),
        keyPassword  : System.getenv("QUEQIAO_ANDROID_KEY_PASSWORD")
]
def suppliedSigningValues = releaseSigning.values().count { value -> value != null && !value.isBlank() }
if (suppliedSigningValues != 0 && suppliedSigningValues != releaseSigning.size()) {
    throw new GradleException("Set all four QUEQIAO_ANDROID_* signing variables or none of them")
}
def releaseSigningConfigured = suppliedSigningValues == releaseSigning.size()

android {
    namespace = "io.github.bojieli.queqiao"
    compileSdk = 37

    defaultConfig {
        applicationId = "io.github.bojieli.queqiao"
        minSdk = 30
        targetSdk = 36
        versionCode = providers.gradleProperty("queqiaoVersionCode").getOrElse("1").toInteger()
        versionName = providers.gradleProperty("queqiaoVersionName").getOrElse("0.1.0-dev")
        testInstrumentationRunner = "io.github.bojieli.queqiao.SecureStoreTestRunner"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = file(releaseSigning.storeFile)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseSigningConfigured) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main {
            assets.srcDir("../../legal")
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        warningsAsErrors = true
        // AndroidGradlePluginVersion reports what upstream has published, not
        // anything about this source. With warningsAsErrors it fails the build
        // on Gradle's release schedule: 9.7.1 landed between two commits here
        // that touched no Android file, and broke the second one. The wrapper
        // version is deliberately pinned, checksummed, and asserted against
        // mobile/build-tools.lock by mobile/scripts/audit-dependencies.sh, so
        // upgrades are a reviewed change to that lock rather than something a
        // lint check should force. Every other check stays an error.
        disable += ["OldTargetApi", "AndroidGradlePluginVersion"]
    }
}

// Gradle's stock names -- app-release-unsigned.apk, app-release.aab,
// app-debug.apk -- say nothing about what a downloaded file contains. Once a
// file leaves CI it has no directory to explain it, so the product, version,
// and build type belong in the name itself.
//
// AGP 9 removed the legacy applicationVariants DSL, so this uses the supported
// androidComponents variant API. Only the APK name is settable here; the
// bundle name is derived by AGP from archivesName, which is set below so the
// AAB is descriptive too. The version comes from the same properties as
// versionName, so an asset cannot disagree with the manifest it ships.
def queqiaoVersionName = providers.gradleProperty("queqiaoVersionName").getOrElse("0.1.0-dev")

base {
    archivesName = "queqiao_v${queqiaoVersionName}_android"
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // Gradle's stock release name ends in "-unsigned", which is the one
        // genuinely useful thing about it: an unsigned APK cannot be installed
        // and must not be handed to a user as though it could. Renaming has to
        // preserve that, so the marker is kept whenever no signing config was
        // supplied through the QUEQIAO_ANDROID_* variables.
        def unsigned = variant.buildType == "release" && !releaseSigningConfigured ? "-unsigned" : ""
        variant.outputs.each { output ->
            // The build type is the only other discriminator. The debug
            // variant's versionNameSuffix already carries "-debug", so naming
            // the type twice would read queqiao_v0.1.0-dev-debug_android_debug.
            output.outputFileName.set("queqiao_v${queqiaoVersionName}_android_${variant.buildType}${unsigned}.apk")
        }
    }
}

dependencies {
    implementation files("libs/mobilecore.aar")
}

// The debug VPN build carries the same packed country set the iOS client ships,
// so a GEOIP rule means the same thing on both. It is copied from that one file
// at build time rather than committed a second time: two copies of a generated
// artifact drift, and the one that drifts is the one nobody regenerates.
//
// Registered through the variant API rather than by adding a directory to the
// debug source set, so Gradle carries the task dependency: an assets directory
// contributed as a bare path is one the build may read before anything has
// written it.
abstract class CopyCountrySet extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getPackedSet()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void copy() {
        File destination = outputDirectory.get().asFile
        destination.mkdirs()
        new File(destination, "cn-direct.bin").bytes = packedSet.get().asFile.bytes
    }
}

androidComponents {
    onVariants(selector().withBuildType("debug")) { variant ->
        def copyTask = tasks.register(
                "copyCountrySet${variant.name.capitalize()}", CopyCountrySet) {
            packedSet.set(rootProject.file("../ios/PacketTunnel/Resources/cn-direct.bin"))
        }
        variant.sources.assets.addGeneratedSourceDirectory(
                copyTask, CopyCountrySet::getOutputDirectory)
    }
}
