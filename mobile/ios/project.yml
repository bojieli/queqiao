name: Queqiao
options:
  bundleIdPrefix: io.github.bojieli
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Self-builders change these three values together before selecting their
    # Apple development team. The keychain suffix must remain shared by the
    # application and packet-tunnel extension.
    QUEQIAO_APP_BUNDLE_ID: io.github.bojieli.queqiao
    QUEQIAO_EXTENSION_BUNDLE_ID: io.github.bojieli.queqiao.PacketTunnel
    QUEQIAO_KEYCHAIN_SUFFIX: io.github.bojieli.queqiao.shared

targets:
  Queqiao:
    type: application
    platform: iOS
    sources:
      - path: Queqiao
      - path: Shared
      - path: ../legal/THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      # The app reads the country set's header so the routing screen can say
      # how many routes the toggle installs. The extension carries its own copy
      # because an app extension cannot read the containing app's bundle.
      - path: PacketTunnel/Resources
        buildPhase: resources
    dependencies:
      - target: PacketTunnel
        embed: true
      - framework: Frameworks/Mobilecore.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUEQIAO_APP_BUNDLE_ID)
        PRODUCT_NAME: Queqiao
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0-dev
    info:
      path: Queqiao/Info.plist
      properties:
        CFBundleDisplayName: Queqiao
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        # Only the invitation scanner asks, and only when opened. Frames are
        # read by the system's own detector and never stored or sent.
        NSCameraUsageDescription: Queqiao reads a one-time invitation from a QR code. The camera image stays on this iPhone.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        QueqiaoKeychainAccessGroup: $(AppIdentifierPrefix)$(QUEQIAO_KEYCHAIN_SUFFIX)
        QueqiaoPacketTunnelBundleIdentifier: $(QUEQIAO_EXTENSION_BUNDLE_ID)
    entitlements:
      path: Queqiao/Queqiao.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(QUEQIAO_KEYCHAIN_SUFFIX)

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    dependencies:
      - framework: Frameworks/Mobilecore.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUEQIAO_EXTENSION_BUNDLE_ID)
        PRODUCT_NAME: PacketTunnel
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0-dev
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Queqiao Packet Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        QueqiaoKeychainAccessGroup: $(AppIdentifierPrefix)$(QUEQIAO_KEYCHAIN_SUFFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(QUEQIAO_KEYCHAIN_SUFFIX)

  QueqiaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QueqiaoTests
      - path: Shared
      # The shipped country set rides along so a test can prove the artifact
      # in the repository actually parses, not just that the parser works.
      - path: PacketTunnel/Resources
        buildPhase: resources
    dependencies:
      - target: Queqiao
      - framework: Frameworks/Mobilecore.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUEQIAO_APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Queqiao:
    build:
      targets:
        Queqiao: all
        PacketTunnel: all
        QueqiaoTests: [test]
    test:
      targets:
        - QueqiaoTests
      gatherCoverageData: true
