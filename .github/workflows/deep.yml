# The campaigns that are too slow, too timing-dependent, or too expensive to
# run on every commit. Weekly and on demand, because Actions minutes on a
# hosted runners are finite and none of this gates every push.
name: deep

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full suite, including everything -short skips.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Keep the wall-clock path emulators isolated from CPU-bound FEC tests,
      # just as in the native and race jobs below. This matters on Linux too.
      - run: go test -p=1 -timeout 50m ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-U1000 ./...
      - name: Gosec reviewed baseline
        run: |
          set +e
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
            -fmt json -out gosec.json ./...
          scanner_status=$?
          set -e
          test "$scanner_status" -eq 0 || test "$scanner_status" -eq 1
          ./scripts/check_gosec.py gosec.json .

  # Exercise every portable test on every native platform shipped in release
  # archives. The long wall-clock impairment cases run on Linux and macOS; the
  # hosted Windows timer stretches their configured path instead of preserving
  # it, so Windows covers the coded path without claiming that timing evidence.
  native-test:
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # -p=1 for the same reason the race job below uses it: parallel packages
      # let CPU-bound erasure coding starve the wall-clock network emulators,
      # and a starved emulator reports a healthy path as a transport fault.
      - run: go test -p=1 -count=1 -timeout 50m ./...

  # The race detector costs this tree roughly an order of magnitude in the
  # erasure code -- internal/fec alone takes seven minutes on a 32-core
  # machine -- so it gets its own job and a long timeout rather than sharing
  # one with the suite above. Packages are serialized because that CPU-bound
  # work otherwise runs beside the wall-clock network emulators and can make a
  # healthy 300 ms path consume a production-sized transport deadline. Go does
  # not support -race on Windows/arm64.
  race:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test -p=1 -race -timeout 110m ./...

  # Reachability-aware scanning against Go's official vulnerability database.
  # The tool version is pinned so a scanner release cannot change a campaign
  # underneath us; the database intentionally remains current.
  vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  fallback-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: ./scripts/fallback_soak.sh --runs 20 --race-runs 5 --output-dir fallback-soak
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fallback-soak-${{ github.run_id }}
          path: fallback-soak/
          if-no-files-found: warn

  # Every fuzz target, discovered rather than listed, so a target added later
  # is smoke-tested without anyone remembering to add it here. This is a
  # crash check, not a campaign: 60 s each finds a panic on a malformed frame
  # and will not find much else.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: smoke every fuzz target
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            for target in $(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              # Avoid the duration-boundary flake tracked as golang/go#72104
              # while keeping a deterministic, fail-closed workload.
              go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 500000x
              echo "::endgroup::"
              found=$((found + 1))
            done
          done
          echo "smoked $found fuzz targets"
          test "$found" -gt 0

  # queqiao against the TUIC-shaped reference over one emulated path. Both
  # stacks run in the same job on the same runner, so a slow or noisy machine
  # moves both rows together and the comparison survives it -- which is the
  # same reason the live harness alternates trials rather than running one
  # stack and then the other.
  #
  # The tolerance is wide and the path is modest for the same reason: two
  # cores emulating 100 Mbit/s is measuring the runner. This is a guard
  # against a transport regression large enough to be visible through that,
  # not a measurement anyone should quote.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: |
          go run ./cmd/queqiaobench --rtt 200 --loss 1 --rate 25 \
            --bytes $((4 * 1024 * 1024)) --trials 3 --flows 1 \
            --gate --tolerance 0.25
