name: release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Non-publishing release-candidate version, vX.Y.Z-rc.N
        required: true
        default: v0.1.1-rc.1
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # The ordinary CI workflow owns mobile builds, emulator qualification, and
  # the six-platform short suite. A candidate must bind that evidence to its
  # exact commit rather than assuming that a nearby main-branch run was green.
  # Pull-request runs are excluded because checkout tests GitHub's synthetic
  # merge commit while the API reports the pull-request head SHA.
  ci-evidence:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require successful normal CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs=$(gh api \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100")
          run=$(python3 ./scripts/select_ci_evidence.py --sha "$GITHUB_SHA" <<<"$runs")
          run_id=$(jq -r .id <<<"$run")
          run_url=$(jq -r .html_url <<<"$run")
          echo "Exact-commit CI evidence: [$run_id]($run_url)" >> "$GITHUB_STEP_SUMMARY"

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Match the native/race jobs: CPU-bound FEC tests must not starve the
      # wall-clock network emulators, including on Linux runners.
      - run: go test -p=1 -timeout 50m ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-U1000 ./...
      - name: Gosec reviewed baseline
        run: |
          set +e
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
            -fmt json -out gosec.json ./...
          scanner_status=$?
          set -e
          test "$scanner_status" -eq 0 || test "$scanner_status" -eq 1
          ./scripts/check_gosec.py gosec.json .
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Python helper tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
  native-test:
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: macos-15-intel, os: darwin, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # -p=1 keeps CPU-bound erasure coding in another package from starving
      # wall-clock network emulators. The high-erasure latency campaigns
      # themselves run on Linux and macOS: hosted Windows timers stretched a
      # configured 300 ms RTT as far as 3.8 s, changing the impairment rather
      # than testing the one requested. Windows still runs every portable test,
      # including coded-path correctness, and executes its packaged binary.
      - run: go test -p=1 -count=1 -timeout 50m ./...

  vulnerability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Smoke every discovered fuzz target
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            for target in $(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz' || true); do
              # A fixed execution count avoids the Go fuzz driver's known
              # duration-boundary flake (golang/go#72104), where a healthy
              # campaign can fail with context deadline exceeded as its own
              # fuzztime expires. Crashes and invariant failures still fail
              # closed, and every target gets the same minimum workload.
              go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 500000x
              found=$((found + 1))
            done
          done
          echo "smoked $found fuzz targets"
          test "$found" -gt 0

  fallback-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: ./scripts/fallback_soak.sh --runs 20 --race-runs 5 --output-dir fallback-soak
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-fallback-soak-${{ github.run_id }}
          path: fallback-soak/
          if-no-files-found: warn
          retention-days: 30

  history-secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan all reachable history with a verified scanner
        env:
          QUEQIAO_SECRET_SCAN_REPORT: history-secret-scan.json
        run: ./scripts/scan_history_secrets.sh .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-history-scan-${{ github.run_id }}
          path: history-secret-scan.json
          if-no-files-found: error
          retention-days: 30

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build the candidate twice
        env:
          VERSION: ${{ inputs.version }}
          GOENV: "off"
          GOEXPERIMENT: ""
          GOFIPS140: "off"
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
          GOWORK: "off"
          GOAMD64: v1
          GOARM64: v8.0
        run: |
          set -euo pipefail
          # Any release-safe candidate version, not one pinned release. The
          # gate that matters is release.yml's: it publishes only a tag whose
          # commit already has a successful candidate run, and that check is
          # on the commit, not on the string used to stamp the build.
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.(0|[1-9][0-9]*)$ ]] || {
            echo "candidate version must be vX.Y.Z-rc.N with a numeric N" >&2
            exit 1
          }
          build_date=$(git show -s --format=%cI "$GITHUB_SHA")
          first="$RUNNER_TEMP/queqiao-dist-first"
          second="$RUNNER_TEMP/queqiao-dist-second"
          go run ./cmd/queqiaopack --version "$VERSION" --commit "$GITHUB_SHA" \
            --build-date "$build_date" --output "$first"
          go clean -cache
          go run ./cmd/queqiaopack --version "$VERSION" --commit "$GITHUB_SHA" \
            --build-date "$build_date" --output "$second"
          diff -r "$first" "$second"
          mv "$first" dist
          ./scripts/validate_release.py dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: queqiaod-candidate-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  native-smoke:
    needs: package
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64, kind: unix}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, kind: unix}
          - {runner: macos-15-intel, os: darwin, arch: amd64, kind: unix}
          - {runner: macos-15, os: darwin, arch: arm64, kind: unix}
          - {runner: windows-2025, os: windows, arch: amd64, kind: windows}
          - {runner: windows-11-arm, os: windows, arch: arm64, kind: windows}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: queqiaod-candidate-${{ github.run_id }}
          path: dist
      - name: Run Unix archive
        if: matrix.kind == 'unix'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive="dist/queqiaod_${VERSION}_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          mkdir smoke
          tar -xzf "$archive" -C smoke
          binary="smoke/queqiaod_${VERSION}_${TARGET_OS}_${TARGET_ARCH}/queqiaod"
          output=$($binary --version)
          echo "$output"
          grep -F "commit=${GITHUB_SHA}" <<<"$output"
          grep -F "wire=1" <<<"$output"
      - name: Run Windows archive
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "dist/queqiaod_$env:VERSION`_windows_$env:TARGET_ARCH.zip"
          Expand-Archive -Path $archive -DestinationPath smoke
          $binary = "smoke/queqiaod_$env:VERSION`_windows_$env:TARGET_ARCH/queqiaod.exe"
          $output = & $binary --version
          Write-Output $output
          if ($output -notmatch [regex]::Escape("commit=$env:GITHUB_SHA")) { throw 'commit metadata mismatch' }
          if ($output -notmatch 'wire=1') { throw 'wire metadata mismatch' }

  # Exercise the same keychain, Developer ID, notarization, Gatekeeper, and
  # attestation path used by the final release before an immutable tag exists.
  # A candidate is non-publishing, but its signed artifacts are retained as
  # evidence that the environment credentials can produce what release.yml
  # promises.
  macos-signing:
    needs: [package, native-smoke]
    runs-on: macos-15
    timeout-minutes: 45
    environment: public-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: queqiaod-candidate-${{ github.run_id }}
          path: dist
      - name: Sign and notarize the candidate macOS binaries
        env:
          VERSION: ${{ inputs.version }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ./scripts/sign_macos_release.sh dist "$VERSION" signed
      - name: Attest the signed candidate assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: signed/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: queqiaod-candidate-${{ github.run_id }}-macos-signed
          path: signed/
          if-no-files-found: error
          retention-days: 30

  provenance:
    if: github.event.repository.visibility == 'public'
    needs: [ci-evidence, full, native-test, vulnerability, fuzz, fallback-soak, history-secret-scan, package, native-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: queqiaod-candidate-${{ github.run_id }}
          path: dist
      - name: Attest every candidate file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

  candidate-summary:
    if: always()
    needs: [ci-evidence, full, native-test, vulnerability, fuzz, fallback-soak, history-secret-scan, package, native-smoke, macos-signing, provenance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every available gate
        env:
          CI_EVIDENCE: ${{ needs.ci-evidence.result }}
          FULL: ${{ needs.full.result }}
          NATIVE_TEST: ${{ needs.native-test.result }}
          VULN: ${{ needs.vulnerability.result }}
          FUZZ: ${{ needs.fuzz.result }}
          SOAK: ${{ needs.fallback-soak.result }}
          HISTORY: ${{ needs.history-secret-scan.result }}
          PACKAGE: ${{ needs.package.result }}
          NATIVE: ${{ needs.native-smoke.result }}
          MACOS_SIGNING: ${{ needs.macos-signing.result }}
          PROVENANCE: ${{ needs.provenance.result }}
          VISIBILITY: ${{ github.event.repository.visibility }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for result in "$CI_EVIDENCE" "$FULL" "$NATIVE_TEST" "$VULN" "$FUZZ" "$SOAK" "$HISTORY" "$PACKAGE" "$NATIVE" "$MACOS_SIGNING"; do
            test "$result" = success
          done
          if test "$VISIBILITY" = public; then
            test "$PROVENANCE" = success
          else
            test "$PROVENANCE" = skipped
            echo "Provenance is intentionally deferred: GitHub Free attestations require a public repository." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Candidate $CANDIDATE_VERSION at $GITHUB_SHA passed every available non-publishing gate." >> "$GITHUB_STEP_SUMMARY"
