# What every push has to satisfy. Kept cheap on purpose: this repository is
# intentionally small; the expensive campaigns live in deep.yml where they run
# on a schedule instead of on every commit.
#
# Hosted minutes are billed by the minute and multiplied by the runner (macOS
# and Windows cost several times Linux), so what runs here follows what the
# change touched (the `changes` job) and what the event is worth. A pull
# request gets the platforms whose platform-specific code it could break, and
# the merged commit on main re-checks all of them; the weekly deep run covers
# the rest.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed decides what runs. A failure to work that out runs everything
  # rather than nothing: a diff it cannot compute is not evidence that the
  # change is harmless.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.pick.outputs.core }}
      mobile: ${{ steps.pick.outputs.mobile }}
      harness: ${{ steps.pick.outputs.harness }}
      test-matrix: ${{ steps.pick.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          base=""
          # A tag is a release: it runs everything, because the release
          # workflows take this run as the exact commit's CI evidence, and a
          # changelog-only release commit would otherwise skip every job.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            :
          elif [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base to diff against; running everything"
            files=""
          else
            files=$(git diff --name-only "$base" "$GITHUB_SHA")
          fi
          core=false; mobile=false; harness=false
          if [ -z "$base" ]; then
            core=true; mobile=true; harness=true
          else
            for f in $files; do
              case "$f" in
                # A change to the apps is covered by the app jobs; the Go core
                # they bind is checked when the core itself changes, by the
                # mobile-core job below.
                mobile/*) mobile=true ;;
                docs/*|*.md|changelog.d/*|LICENSE*|*.png|*.svg|*.gif) ;;
                scripts/*) harness=true ;;
                # A workflow edit is checked by everything it can change.
                .github/*) core=true; mobile=true; harness=true ;;
                *) core=true ;;
              esac
            done
            [ "$core" = true ] && harness=true
          fi
          # A pull request gets the platforms whose platform-specific code it
          # could break (Linux is the server, Windows the one with its own
          # clock and service code); the merged commit on main re-checks all
          # six, and deep.yml runs the long suite on all of them weekly.
          if [ "$EVENT" = "pull_request" ]; then
            matrix='[{"runner":"ubuntu-24.04","os":"linux","arch":"amd64"},{"runner":"windows-2025","os":"windows","arch":"amd64"}]'
          else
            matrix='[{"runner":"ubuntu-24.04","os":"linux","arch":"amd64"},{"runner":"ubuntu-24.04-arm","os":"linux","arch":"arm64"},{"runner":"macos-15-intel","os":"darwin","arch":"amd64"},{"runner":"macos-15","os":"darwin","arch":"arm64"},{"runner":"windows-2025","os":"windows","arch":"amd64"},{"runner":"windows-11-arm","os":"windows","arch":"arm64"}]'
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "test-matrix=$matrix" >> "$GITHUB_OUTPUT"

  # The build matrix exists because it has already caught something: the
  # external-proxy harness used Setpgid, Getpgid and Kill directly and did not
  # compile for Windows at all, on a tree whose tests were entirely green.
  # Nothing but a cross-build finds that.
  build:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: every advertised target compiles
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "--- $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./... || exit 1
          done

  vet:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  # Changelog entries are one file per change in changelog.d/, assembled into
  # CHANGELOG.md only at release time. Nothing else writes that file, which is
  # what stops two branches conflicting over the same list every time both of
  # them describe a user-visible change.
  # Every change, whatever it touched: a fragment is one file and the check is
  # seconds of one runner.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: pending entries are well formed
        run: ./scripts/changelog.py check
      - name: CHANGELOG.md is assembled, not edited
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # "I cannot compare" is not "you edited it". Saying so cost an hour
          # once already: a pull request whose base branch had been deleted
          # failed this step reporting a changelog edit it had not made.
          base="origin/${BASE_REF}"
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "Cannot resolve ${base}, so this check cannot tell whether"
            echo "CHANGELOG.md was edited. That is a checkout or base-branch"
            echo "problem rather than a changelog one: the base branch may have"
            echo "been deleted or renamed while this pull request was open."
            exit 1
          fi
          changed=0
          git diff --quiet "${base}...HEAD" -- CHANGELOG.md || changed=$?
          if [ "$changed" -eq 0 ]; then
            exit 0
          fi
          if [ "$changed" -ne 1 ]; then
            echo "git diff against ${base} failed with status ${changed}, so"
            echo "whether CHANGELOG.md was edited is unknown."
            exit 1
          fi
          # Read the label from the API rather than from the event payload,
          # which is a snapshot taken when the pull request was opened. Adding
          # the label to an open pull request and re-running this job has to be
          # enough; with the payload it never is.
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" \
              --jq '.[].name' | grep -qx changelog; then
            echo "The 'changelog' label permits this pull request to edit it."
            exit 0
          fi
          echo "CHANGELOG.md is assembled from changelog.d/ at release time."
          echo "Describe this change in its own file instead:"
          echo "  ./scripts/changelog.py new <category> <slug>"
          echo "A pull request that means to edit it carries the 'changelog'"
          echo "label; add it and re-run this job."
          exit 1

  analysis:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-U1000 ./...
      - name: Gosec reviewed baseline
        run: |
          set +e
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 \
            -fmt json -out gosec.json ./...
          scanner_status=$?
          set -e
          test "$scanner_status" -eq 0 || test "$scanner_status" -eq 1
          ./scripts/check_gosec.py gosec.json .

  # Run the portable suite on the platforms this event is worth: two for a
  # pull request, every advertised native OS and architecture for the merged
  # commit. -short skips the tests that bring QUIC up across an emulated 300 ms
  # erasure path, and the emulator calibrations that need an uncontended host
  # to measure anything. Those run natively in deep.yml and
  # release-candidate.yml.
  test:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test -short -timeout 20m ./...

  # The validation harness and the repository's own house rules (changelog
  # shape, download links, release metadata): stdlib Python, one cheap runner.
  harness:
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  mobile-core:
    needs: changes
    # The binding compiles against the Go core, so a core change is checked
    # here too; the apps themselves (Android, iOS) are not.
    if: needs.changes.outputs.mobile == 'true' || needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - run: mobile/scripts/audit-dependencies.sh
      - run: go test ./mobile/tools/notices
      - run: go test -race ./...
        working-directory: mobile/core
      - run: go vet ./...
        working-directory: mobile/core
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks=all,-U1000 ./...
        working-directory: mobile/core
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...
        working-directory: mobile/core
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        working-directory: mobile/core
      - name: notices are reproducible
        run: |
          go run ./mobile/tools/notices \
            -core mobile/core \
            -lock mobile/runtime-dependencies.lock \
            -output mobile/legal/THIRD_PARTY_NOTICES.txt
          git diff --exit-code -- mobile/legal/THIRD_PARTY_NOTICES.txt

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      # Gradle's dependency and wrapper caches, one entry per job. An entry is
      # saved only after the job's build has resolved everything it needs, so
      # a restored entry is complete. setup-java's single "gradle" cache was
      # shared by both Android jobs, saved by whichever finished first, and so
      # never held the instrumentation runner's dependencies (#199).
      - name: restore Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/gradle.properties', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle/verification-metadata.xml', 'mobile/scripts/gradle-with-retries.sh', 'mobile/scripts/prefetch-configurations.init.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ github.job }}-
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
      - name: install pinned Android SDK components
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.0.12433566"
      - run: mobile/scripts/build-android-core.sh
      - name: lint, shrink, and package (retried on dependency fetch errors)
        run: >-
          mobile/scripts/gradle-with-retries.sh
          lintDebug lintRelease
          assembleDebug assembleDebugAndroidTest
          assembleRelease bundleRelease
      - name: save Gradle dependency cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: assert the released manifest declares both modes and nothing more
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          apk=$(ls mobile/android/app/build/outputs/apk/release/*.apk)
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          # The release build ships two ways to connect: the full-device tunnel
          # and the exported loopback endpoint. Both services have to be there,
          # the tunnel has to be bindable by the system alone, and neither may
          # be exported -- a stray manifest merge is what this catches.
          grep -q 'QueqiaoVpnService' <<<"$manifest"
          grep -q 'QueqiaoProxyService' <<<"$manifest"
          grep -q 'android.permission.BIND_VPN_SERVICE' <<<"$manifest"
          if grep -A12 -E 'E: service' <<<"$manifest" |
              grep -E 'android:exported\([^)]*\)=true'; then
            echo "a service in the release manifest is exported" >&2
            exit 1
          fi
          # The permission set is enumerated rather than denylisted: an app that
          # talks to one gateway has a small, enumerable set of things to ask
          # for, and anything outside it arrived by accident or by a merged
          # library manifest. Update the list deliberately, with a reason.
          # CAMERA: ScanInvitationActivity reads a queqiao:// invitation from
          # a QR code; the frame is decoded in process by the Go core.
          expected=$(printf '%s\n' \
            android.permission.ACCESS_NETWORK_STATE \
            android.permission.CAMERA \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_SPECIAL_USE \
            android.permission.INTERNET \
            android.permission.POST_NOTIFICATIONS | sort)
          declared=$("$aapt2" dump permissions "$apk" |
            sed -n "s/^uses-permission: name='\\(.*\\)'$/\\1/p" | sort -u)
          if [ "$declared" != "$expected" ]; then
            echo "the release permission set changed:" >&2
            diff <(echo "$expected") <(echo "$declared") >&2 || true
            exit 1
          fi
      # The Android build previously proved the APKs compile and then discarded
      # them, so nothing downstream could inspect what CI had actually built.
      # These are CI artifacts for review, not release assets: the release APK
      # is unsigned, its name says so, and publication remains a separate
      # reviewed decision.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: queqiao-android-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  android-instrumentation:
    name: Android Keystore API ${{ matrix.api }}
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      # Gradle's dependency and wrapper caches, one entry per job. An entry is
      # saved only after the job's build has resolved everything it needs, so
      # a restored entry is complete. setup-java's single "gradle" cache was
      # shared by both Android jobs, saved by whichever finished first, and so
      # never held the instrumentation runner's dependencies (#199).
      - name: restore Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ github.job }}-${{ hashFiles('mobile/android/**/*.gradle', 'mobile/android/gradle.properties', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle/verification-metadata.xml', 'mobile/scripts/gradle-with-retries.sh', 'mobile/scripts/prefetch-configurations.init.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ github.job }}-
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
      - name: remove preinstalled NDKs before pinned install
        run: |
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          sudo rm -rf -- /usr/local/lib/android/sdk/ndk
      - name: install official Android emulator image
        run: >-
          sdkmanager
          "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.0.12433566"
          "emulator" "platform-tools"
          "system-images;android-${{ matrix.api }};google_apis;x86_64"
      - run: mobile/scripts/build-android-core.sh
      # The instrumentation runner's own dependencies are resolved only once
      # connectedDebugAndroidTest starts; fetch them here, where a Maven
      # Central error can be retried, and run the test step offline.
      - name: assemble APKs and prefetch the test runner (retried on dependency fetch errors)
        run: >-
          mobile/scripts/gradle-with-retries.sh
          -Pqueqiao.prefetch=unified-test-platform
          assembleDebug assembleDebugAndroidTest
          :app:queqiaoPrefetchDependencies
      - name: save Gradle dependency cache
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: remove build-only NDK before emulator
        run: |
          test "$ANDROID_HOME" = /usr/local/lib/android/sdk
          sudo rm -rf -- /usr/local/lib/android/sdk/ndk
          # The AAR and both APKs are complete. Hosted runners are tight enough
          # that emulator 37 may otherwise miss creation of its userdata image
          # by only a few hundred MB, so release the Go caches before the AVD.
          go clean -cache -modcache -testcache -fuzzcache
      - name: start isolated emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | avdmanager create avd --force \
            --name queqiao_ci \
            --package "system-images;android-${{ matrix.api }};google_apis;x86_64" \
            --device pixel_6
          config="$ANDROID_AVD_HOME/queqiao_ci.avd/config.ini"
          grep -q '^disk\.dataPartition\.size' "$config"
          sed -i -E \
            's/^disk\.dataPartition\.size[[:space:]]*=.*/disk.dataPartition.size = 2147483648/' \
            "$config"
          test -x "$ANDROID_HOME/emulator/emulator"
          nohup "$ANDROID_HOME/emulator/emulator" @queqiao_ci \
            -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect \
            >"$RUNNER_TEMP/queqiao-emulator.log" 2>&1 &
          if ! timeout 60s adb wait-for-device; then
            cat "$RUNNER_TEMP/queqiao-emulator.log"
            exit 1
          fi
          for _ in {1..90}; do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/queqiao-emulator.log"
          exit 1
      - name: run mobile storage and routing checks
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon --offline --dependency-verification strict
          connectedDebugAndroidTest

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/core/go.mod
          cache-dependency-path: |
            go.sum
            mobile/core/go.sum
      - run: mobile/scripts/build-ios-core.sh
      - run: ../scripts/run-swiftlint.sh lint --strict --config .swiftlint.yml .
        working-directory: mobile/ios
      - name: prepare hosted iOS simulator
        id: ios-simulator
        run: |
          set -euo pipefail
          # Hosted arm64 images intermittently start with an empty device set
          # even though the runtimes are installed. Listing first refreshes
          # CoreSimulator's inventory; creating the device covers the cases
          # where the refresh finds the runtime but no precreated phones.
          xcrun simctl list
          device_id=$(
            xcrun simctl list devices available --json |
              jq -r '[.devices[][] | select(.name == "iPhone 17")] | last.udid // empty'
          )
          if [[ -z "$device_id" ]]; then
            runtime_id=$(
              xcrun simctl list runtimes available --json |
                jq -r '[.runtimes[] | select(.identifier | contains(".SimRuntime.iOS-"))] | last.identifier // empty'
            )
            test -n "$runtime_id"
            device_id=$(
              xcrun simctl create "Queqiao CI iPhone 17" \
                com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime_id"
            )
          fi
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: simulator build and boundary tests
        working-directory: mobile/ios
        run: >-
          xcodebuild
          -project Queqiao.xcodeproj
          -scheme Queqiao
          -destination 'platform=iOS Simulator,id=${{ steps.ios-simulator.outputs.id }}'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          test

  # Exercise the actual release path, including embedded version metadata and
  # deterministic archive creation. One target is enough here; release.yml
  # packages the complete six-target matrix.
  package:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: package smoke test
        run: |
          build_date=$(git show -s --format=%cI HEAD)
          go run ./cmd/queqiaopack \
            --version v0.0.0-ci --commit "${GITHUB_SHA}" \
            --build-date "$build_date" --targets linux/amd64 \
            --output dist
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          ./scripts/validate_release.py --expected-targets linux/amd64 dist
          cd dist
          tar -xzf queqiaod_v0.0.0-ci_linux_amd64.tar.gz
          ./queqiaod_v0.0.0-ci_linux_amd64/queqiaod --version |
            grep -F "queqiaod v0.0.0-ci commit=${GITHUB_SHA}"
