<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="1240" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Two bar charts. On the speech recognition upload, which runs on the direction that loses nothing, a tuned direct client reaches 241 milliseconds on a reused connection and Queqiao reaches 237, so the two are the same answer. On a new connection direct TCP takes 1185 milliseconds and Queqiao 302. On the speech synthesis download, which runs on the direction that erases about 14 percent, the download leg takes 945 milliseconds direct while Queqiao is 68, which is 13.9 times faster.">
  <rect x="0" y="0" width="1240" height="580" fill="#FBFCFE"/>

  <text x="620" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">The free client fix reaches the median. It does not reach the rest.</text>
  <text x="620" y="72" text-anchor="middle" font-size="16" fill="#64748B">Reusing the connection and setting one sysctl costs a config line. Do it first.</text>

  <rect x="330" y="94" width="14" height="14" rx="2" fill="#C2410C"/>
  <text x="352" y="106" font-size="13.5" fill="#334155">direct TCP, untuned</text>
  <rect x="510" y="94" width="14" height="14" rx="2" fill="#94A3B8"/>
  <text x="532" y="106" font-size="13.5" fill="#334155">direct TCP, tuned client</text>
  <rect x="720" y="94" width="14" height="14" rx="2" fill="#2563EB"/>
  <text x="742" y="106" font-size="13.5" fill="#334155">through Queqiao</text>

  <!-- LEFT: ASR upload, clean direction -->
  <text x="60" y="152" font-size="18" font-weight="700" fill="#0F172A">ASR upload, 355KB</text>
  <text x="60" y="174" font-size="14" fill="#15803D">upstream, which loses nothing: 0 of 41,663</text>

  <line x1="60" y1="430" x2="600" y2="430" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="190" y="454" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">connection reused</text>
  <rect x="140" y="382" width="50" height="48" rx="3" fill="#94A3B8"/>
  <text x="165" y="374" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">241</text>
  <rect x="200" y="383" width="50" height="47" rx="3" fill="#2563EB"/>
  <text x="225" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">237</text>

  <text x="440" y="454" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">new connection</text>
  <rect x="390" y="193" width="50" height="237" rx="3" fill="#C2410C"/>
  <text x="415" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#9A3412">1185</text>
  <rect x="450" y="370" width="50" height="60" rx="3" fill="#2563EB"/>
  <text x="475" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">302</text>

  <text x="330" y="486" text-anchor="middle" font-size="14" fill="#15803D">Tuned and warm, the two are the same answer, and both are</text>
  <text x="330" y="506" text-anchor="middle" font-size="14" fill="#15803D">within 10ms of what a 200ms round trip and a 30ms model allow.</text>

  <line x1="640" y1="140" x2="640" y2="460" stroke="#E2E8F0" stroke-width="2"/>

  <!-- RIGHT: TTS download, erasing direction -->
  <text x="690" y="152" font-size="18" font-weight="700" fill="#0F172A">TTS download, 100KB</text>
  <text x="690" y="174" font-size="14" fill="#B91C1C">downstream, which erases about 14%</text>

  <line x1="690" y1="430" x2="1180" y2="430" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="905" y="454" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">time to move the audio back</text>

  <rect x="800" y="241" width="70" height="189" rx="3" fill="#C2410C"/>
  <text x="835" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#9A3412">945</text>
  <rect x="920" y="416" width="70" height="14" rx="3" fill="#2563EB"/>
  <text x="955" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">68</text>

  <text x="935" y="486" text-anchor="middle" font-size="14" fill="#7F1D1D">A sysctl restores a window after an idle gap. It does</text>
  <text x="935" y="506" text-anchor="middle" font-size="14" fill="#7F1D1D">nothing about a packet that was dropped. 13.9x.</text>

  <rect x="120" y="528" width="1000" height="40" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="620" y="553" text-anchor="middle" font-size="15" fill="#1E40AF">Deploy this for what the config line cannot reach: a cold connection, a direction that erases, or a caller you cannot reconfigure.</text>
</svg>
