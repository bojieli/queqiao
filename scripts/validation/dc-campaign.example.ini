; Example stage 9 DC gate campaign for scripts/ab_campaign.py
; (DESIGN-PATH-AUTHORITY.md section 11.3). Copy to a git-ignored
; *.local.ini and fill in your hosts. See docs/VALIDATING-A-BUNDLE.md.
;
; Shape: one temporary gateway per arm with --path-profile dc-long-haul (the
; runner adds it to both ends), several loaded leaves and one control leaf.
; A leaf is an endpoint pair; the gateway is the sender for downloads, so
; its tree is egress -> group -> client address and each client host is one
; leaf under the gateway's shared egress. Pick enough loaded leaves, flows and
; bytes that the shared ancestor binds: the in-block calibration checks it.

[campaign]
name = example-dc-gate
blocks = 12
seed = 20261125
workload = dc
; Sustained phase length; also each solo calibration run.
duration = 60
object_bytes = 268435456
gap = 5
block_gap = 10
snapshot_every = 4
lane_trace = true

[dc]
; Loaded leaves (client sections), each on its own host.
loaded = leaf-a leaf-b leaf-c
; The uncongested sibling: request-sized fetches every control_interval s.
control = leaf-ctl
bulk_flows_per_leaf = 2
; Request phase: waves x requests_per_leaf concurrent fetches of
; request_bytes on every loaded leaf at once (the profile's 300 KB shape).
request_bytes = 307200
requests_per_leaf = 8
waves = 3
request_timeout = 30
control_interval = 1.0
; Solo runs of each loaded leaf on the legacy arm at the end of every block.
calibrate = true
; Solo runs per leaf per calibration (median taken); 3 resists one bad run at
; three times the calibration's cost. calibrate_arms = all also records the
; candidate's solo (single-connection) rates.
calibrate_repeats = 1
calibrate_arms = main

; The upload phase (#235): the legacy tree couples only the Clients of one
; client process, so the download phases above cannot see its joint limit.
; Here one multi-provider client on the uploader host has one provider per
; upload leaf, each reaching the gateway through a relay on that leaf's own
; host ([upleaf:...]), so each provider is its own leaf and the uploader's
; uplink is their common ancestor. The upload leaves upload backlogged 4 MB
; objects at once; the light sibling sends one 355 KB request every
; control_interval. Pick an uploader whose uplink the upload leaves together
; saturate: the upload calibration checks it (dc_gate.ini [upload]).
uploader = uploader
upload_leaves = up-a up-b up-c
upload_control = up-ctl
upload_flows_per_leaf = 2
upload_object_bytes = 4194304
upload_port_base = 23700

[gateway]
host = dc-gateway-host
address = 198.51.100.20
platform = linux/amd64
port_base = 23471
metrics_port_base = 23491
origin_port = 23480
flags = --transport auto --max-sessions 4096 --allow-private-destinations

[client:leaf-a]
host = dc-client-a
small = true
[client:leaf-b]
host = dc-client-b
small = true
[client:leaf-c]
host = dc-client-c
small = true
[client:leaf-ctl]
host = dc-client-d
small = true

[client:uploader]
host = dc-client-e
small = true

; Each upload leaf's relay host and the address the uploader dials it at.
[upleaf:up-a]
host = dc-client-a
address = 198.51.100.31
[upleaf:up-b]
host = dc-client-b
address = 198.51.100.32
[upleaf:up-c]
host = dc-client-c
address = 198.51.100.33
[upleaf:up-ctl]
host = dc-client-d
address = 198.51.100.34

[arm:legacy]
role = main
ref = origin/main
flags = --bundle=legacy

; Flags are the section 14 switch names; check `queqiaod client -h` on the
; candidate build, since later stages add them. The legacy arm takes no
; switch: dc-long-haul refuses classifier=phased on its legacy bundle.
[arm:pathauth]
role = candidate
ref = origin/main
; dc-long-haul runs the legacy bundle or its whole new-architecture bundle,
; nothing in between (section 11.3, stage 9; the daemon refuses the rest): the
; stage 1-8 switches with classifier=phased, shared on both ends; --topology
; is a client switch and --gateway-admission a gateway switch
; (test_argv_smoke.py starts each role with these). No --topology-fanout:
; recovery=carrier refuses it.
flags = --cc-api=v2 --sched=class --mem=owned --coded-retry=sticky --congestion-scope=path --classifier=phased --recovery=carrier
client_flags = --topology=single
gateway_flags = --gateway-admission=owned

[production:gw]
host = dc-gateway-host
units = queqiaod
ports = 443 19090
[production:a]
host = dc-client-a
units = queqiaod
[production:b]
host = dc-client-b
units = queqiaod
[production:c]
host = dc-client-c
units = queqiaod
[production:d]
host = dc-client-d
units = queqiaod
[production:e]
host = dc-client-e
units = queqiaod
