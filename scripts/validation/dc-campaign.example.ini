; Example stage 9 DC gate campaign for scripts/ab_campaign.py
; (DESIGN-PATH-AUTHORITY.md section 11.3). Copy to a git-ignored
; *.local.ini and fill in your hosts. See docs/VALIDATING-A-BUNDLE.md.
;
; Shape: one temporary gateway per arm with --path-profile dc-long-haul (the
; runner adds it to both ends), several loaded leaves and one control leaf.
; A leaf is an endpoint pair; the gateway is the sender for downloads, so
; its tree is egress -> group -> client address and each client host is one
; leaf under the gateway's shared egress. Pick enough loaded leaves, flows and
; bytes that the shared ancestor binds: the in-block calibration checks it.

[campaign]
name = example-dc-gate
blocks = 12
seed = 20261125
workload = dc
; Sustained phase length; also each solo calibration run.
duration = 60
object_bytes = 268435456
gap = 5
block_gap = 10
snapshot_every = 4
lane_trace = true

[dc]
; Loaded leaves (client sections), each on its own host.
loaded = leaf-a leaf-b leaf-c
; The uncongested sibling: request-sized fetches every control_interval s.
control = leaf-ctl
bulk_flows_per_leaf = 2
; Request phase: waves x requests_per_leaf concurrent fetches of
; request_bytes on every loaded leaf at once (the profile's 300 KB shape).
request_bytes = 307200
requests_per_leaf = 8
waves = 3
request_timeout = 30
control_interval = 1.0
; Solo runs of each loaded leaf on the legacy arm at the end of every block.
calibrate = true

[gateway]
host = dc-gateway-host
address = 198.51.100.20
platform = linux/amd64
port_base = 23471
metrics_port_base = 23491
origin_port = 23480
flags = --transport auto --max-sessions 4096 --allow-private-destinations

[client:leaf-a]
host = dc-client-a
small = true
[client:leaf-b]
host = dc-client-b
small = true
[client:leaf-c]
host = dc-client-c
small = true
[client:leaf-ctl]
host = dc-client-d
small = true

[arm:legacy]
role = main
; The DC gate (stage 9) decided before the legacy bundle was deleted; its
; legacy arm was a build from before stage 11 started with every switch off,
; and dc_gate.py checks the bundle each endpoint recorded. The previous
; release records none, so rerunning the gate as written needs such a build
; (ref = <a commit from stage 9 or 10>, flags = --bundle=legacy).
ref = v0.14.0

[arm:pathauth]
role = candidate
; dc-long-haul on the path-authority architecture (section 11.3), the only
; one this build runs.
ref = origin/main
flags = --carrier-shadow

[production:gw]
host = dc-gateway-host
units = queqiaod
ports = 443 19090
[production:a]
host = dc-client-a
units = queqiaod
[production:b]
host = dc-client-b
units = queqiaod
[production:c]
host = dc-client-c
units = queqiaod
[production:d]
host = dc-client-d
units = queqiaod
