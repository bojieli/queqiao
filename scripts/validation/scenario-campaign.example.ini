; Example scenario campaign (Phase A of the workload model: W5 LLM streaming,
; W6 terminal, M1/M2 mixed). Copy to a git-ignored *.local.ini and fill in
; your hosts; see campaign.example.ini for the sections shared with every
; campaign, and docs/VALIDATING-A-BUNDLE.md, "Scenario workloads".
;
; Change `workload` to term or mixed for the other two; each has its own
; [workload:<name>] section. python3 is required on every client host, and
; openssl on the gateway host unless tls = false.

[campaign]
name = example-llm
blocks = 12
seed = 20261125
workload = llm
; The bulk object the down4 background fetches from the origin.
object_bytes = 268435456
gap = 5
block_gap = 10
snapshot_every = 4
lane_trace = true

[workload:llm]
; Cells: every sequence x prompt size x background. Each runs about a minute.
sequences = single loop
uploads_kb = 100 400
backgrounds = none down4 up1
calls = 5
turns = 5
agents = 8
think_ms = 500
deltas = 400
cadence_ms = 25
; A call that receives nothing for this long fails (an SDK idle timeout).
timeout = 30
; Backgrounds start this long before the calls.
background_lead = 5
; The longest a cell may take; its jobs' timeouts derive from it.
phase_seconds = 180
; The far side (scripts/validation/wlserver.py) on the gateway's loopback.
server_port = 23485
term_port = 23486
tls = true

[gateway]
host = gateway-host
address = 192.0.2.10
platform = linux/amd64
port_base = 23471
metrics_port_base = 23491
origin_port = 23480
flags = --transport auto --max-sessions 4096 --allow-private-destinations

[client:path-a]
host = small-client-host
small = true
platform = linux/amd64
flags = --wire-versions 2

[arm:main]
role = main
; Since stage 11 the build has one architecture and no switches: the
; reference is the previous release (the legacy bundle) and the candidate is
; this build. A campaign that compares migration bundles needs builds from
; before stage 11, with their switches (docs/VALIDATING-A-BUNDLE.md).
ref = v0.14.0

[arm:cand]
role = candidate
ref = origin/main

[production:gateway]
host = gateway-host
units = queqiaod
ports = 443 12540-12639 19090

[production:small-client]
host = small-client-host
units = queqiao-relay-1
