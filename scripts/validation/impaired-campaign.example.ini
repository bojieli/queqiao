; Reliability under slow, lossy and broken networks (scripts/workloads/impaired.py,
; scripts/ab_impair.py; docs/VALIDATING-A-BUNDLE.md, "Impaired networks").
; Copy to a git-ignored *.local.ini and fill in your hosts. The [impair] host
; is the path's client host: tc/netem there (as root) on the campaign's own
; ports only, never on production's. Three arms: main, the stage 1-7 bundle,
; and the same with stage 8's carrier recovery.

[campaign]
name = impaired-path-a
sequential = true
first_blocks = 4
blocks = 6
alpha = 0.05
spending = pocock
seed = 20261127
workload = impaired
; The blackhole's in-flight download: long enough to span both outages.
object_bytes = 268435456
gap = 0
block_gap = 0
snapshot_every = 2
lane_trace = true
host_cpu = true
; Fetch logs through the relay host when the direct link to the gateway is slow.
; fetch_via = relay-host

[workload:impaired]
trials = slow-lossy blackhole policed
idle_wake = true
idle_wake_on_small = true
server_port = 23485
term_port = 23486
udp_port = 23487
wake_port = 23488
tls = true

[impair]
host = small-client-host
device = auto

[gateway]
host = gateway-host
address = 192.0.2.10
platform = linux/amd64
port_base = 23471
metrics_port_base = 23491
origin_port = 23480
; Both arms. No --tcp-congestion: the host offers only reno and cubic.
flags = --transport auto --max-sessions 4096 --allow-private-destinations --tcp-fallback-lanes 16

; The production path: clients reach the gateway through the HK relay. Per arm
; a temporary relay on HK forwards that arm's port (TCP and UDP) to the
; gateway's same port.
[relay]
host = relay-host
address = 198.51.100.20
platform = linux/amd64

[client:path-a]
host = small-client-host
small = true
platform = linux/amd64
socks_port_base = 23581
metrics_port_base = 23591

; All three arms keep the classifier fix on.
[arm:main]
role = main
; Since stage 11 the build has one architecture and no switches: the
; reference is the previous release (the legacy bundle) and the candidate is
; this build. A campaign that compares migration bundles needs builds from
; before stage 11, with their switches (docs/VALIDATING-A-BUNDLE.md).
ref = v0.14.0

[arm:s8]
role = candidate
; The path-authority architecture, whose carrier recovery the impairments
; exercise (stage 8).
ref = origin/main

[production:gateway-host]
host = gateway-host
units = queqiaod
ports = 22 12540
paths = /usr/local/bin/queqiaod /var/lib/queqiao /etc/queqiao

[production:small-client-host]
host = small-client-host
ports = 22

[production:relay-host]
host = relay-host
ports = 22
