; Acceptance bounds for the stage 9 DC gate, read by scripts/dc_gate.py.
;
; FROZEN. docs/DESIGN-PATH-AUTHORITY.md section 11.3 requires these
; thresholds to be "fixed before it is run", and the round-5 design review
; (finding P1-5) repeats it. Change a value only in a commit of its own that
; lands before the stage 9 campaign starts; a change made after any stage 9
; data has been seen voids that campaign.
;
; What the gate guards (section 11.3): the dc-long-haul profile on the new
; architecture (one authority per leaf, the tree used only as knowledge) must
; keep the hierarchy's measured benefit. The regime it guards is the one the
; profile's own measurements found (docs/DESIGN-DC-PROFILE.md:149-151 and
; 468-475; data in docs/PATH-CHARACTER-DC-20260826.md, "One relay or
; several"): three independent relays moved about 2.5x the aggregate of one
; shared relay, while the shared relay finished all 24 flows within 2 ms of
; each other and the independent groups spread out by 3.5x. Losing the shared
; budget buys aggregate and costs exactly this fairness, so the gate bounds
; the worst leaf and the spread against the legacy bundle measured in the same
; campaign. A knowledge-only tree that fails the fairness criterion fails the
; gate, and the legacy bundle stays for this profile (section 11.3, "Fail").
;
; Every criterion is a paired per-block contrast, required positive at the
; one-sided (1 - alpha) level by both a t-interval and the bootstrap.

[statistics]
alpha = 0.05
bootstrap_resamples = 20000
bootstrap_seed = 11
; Void and rerun if more than this fraction of the legacy arm's blocks
; delivered zero sustained bytes (section 15.4).
max_zero_main_fraction = 0.10

[validity]
; The workload must actually have a binding common ancestor: averaged over
; blocks, the legacy arm's simultaneous aggregate must be at most this
; fraction of the sum of the loaded leaves' solo rates (in-block calibration,
; [dc] calibrate = true). Otherwise the campaign is void: it did not test the
; regime the gate is about.
binding_max = 0.80

[gate]
; Sustained goodput: the section 15.4 gate against the legacy bundle,
; aggregate useful bytes of the loaded leaves. d = cand - 0.90 x legacy.
goodput_ratio = 0.90
; Request latency (all loaded leaves' request completions, simultaneous
; phase) must not exceed legacy's by more than 10% at the median and at p99
; (section 11.3). d = 1.10 x legacy - cand, for each.
latency_max_ratio = 1.10
; Worst leaf's service: the least-served loaded leaf's sustained useful bytes.
; d = cand - 0.90 x legacy.
worst_leaf_ratio = 0.90
; Completion spread: the slowest leaf's median request completion over the
; fastest leaf's. d = 1.25 x legacy - cand.
spread_max_ratio = 1.25
; And never into the independent-relay regime: d = 3.5 - cand.
spread_ceiling = 3.5
; Cross-leaf fairness: Jain's index over the loaded leaves' sustained bytes.
; d = cand - (legacy - 0.05).
jain_margin = 0.05
; The uncongested sibling (control leaf) must not be throttled by tree
; knowledge: its request p50 under the others' load. d = 1.10 x legacy - cand.
control_max_ratio = 1.10
