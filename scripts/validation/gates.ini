; Statistical gate for live A/B campaigns, read by scripts/ab_analyze.py.
;
; Source: docs/DESIGN-PATH-AUTHORITY.md section 15.4 (the design PR, #171).
; These values are pre-registered: change them only before a campaign starts,
; in a commit of their own. Changing one after seeing a campaign's data voids
; that campaign.

[primary]
; d_b = candidate_b - ratio * main_b, in useful bytes per block. The gate
; passes on a path when the one-sided (1 - alpha) lower bound of the mean
; contrast is above zero. The design's primary interval is a t-interval with
; the bootstrap as a check; the analyzer requires both bounds to clear zero.
ratio = 0.90
alpha = 0.05
bootstrap_resamples = 20000
bootstrap_seed = 7
; A campaign in which more than this fraction of main's blocks delivered zero
; bytes is void and is rerun (section 15.4).
max_zero_main_fraction = 0.10
; Missing-data rule for the secondaries: a secondary is judged only when it
; was measured in both arms in at least this fraction of the blocks the
; primary gate judged; otherwise it is "not measured" and the overall gate
; is INCOMPLETE. 1.0 means every block, every trial.
secondary_min_coverage = 1.0

[power]
; Sample size from a 12-block pilot: power for the alternative "true ratio 1"
; (expected contrast 0.10 * E[main]), not for the pilot's observed contrast.
; The pilot's blocks are not reused in the campaign.
pilot_blocks = 12
power = 0.80
true_ratio = 1.0

[harness]
; A control-plane failure -- the runner lost one of a trial's jobs: its host
; unreachable through every ssh retry, the job outliving its window, or
; leaving no record -- voids the whole block, both arms (not evidence; it
; still counts toward the sequential cap). A trial type with more than this
; many such blocks in a campaign has no verdict. Failures a job itself
; records (a cut or reset transfer, a timeout inside the tunnel) are the
; arm's evidence and are never voided. FROZEN; adopted during the first
; stage 6/7 campaign, before its first sequential look, without regard to
; any outcome.
control_plane_void_max = 2

[contention]
; A block is void (not evidence; it still counts toward the sequential cap)
; when, in any of its trials on a loaded host, production's own CPU (its
; units' processes) took more than production_share_max of the host's CPU
; over the trial, the hypervisor stole more than steal_max_fraction of it (a
; neighbour contending, which hits the arms unpredictably), or the host's or
; production's CPU record is missing. The test's own load is not
; contention of production: a host at or above busy_threshold is reported
; per arm (an arm busy that long for more than half its trials is flagged
; CPU-bound), never voided. From the runner's host CPU samples ([campaign]
; host_cpu = true). FROZEN before the first block of a campaign that uses it.
busy_threshold = 0.90
production_share_max = 0.20
steal_max_fraction = 0.10

[secondary]
; Section 15.4 lists secondary outcomes, "all required, each with a
; pre-registered one-sided bound". The design does not give the bounds.
; PROVISIONAL margins below: confirm them for the stage before its campaign.
;
; Each line: metric = better margin
;   better = higher: pass when the lower bound of (candidate - main) >= -margin
;   better = lower:  pass when the upper bound of (candidate - main) <= margin
; computed per block (mean of the arm's two trials), one-sided at alpha,
; with the bootstrap settings above.
completion = higher 0.02
stalls_per_trial = lower 2.0
reissued_per_source = lower 0.02
; Gateway QUIC bytes sent per useful byte (the download direction). A trial
; in which any flow fell back to TCP has no QUIC-only wire count and is not
; measured, so the coverage rule applies.
wire_per_useful = lower 0.10
queue_p90_ms = lower 50
interactive_p99_s = lower 0.05
cpu_p90 = lower 0.10
; Required by section 15.4 but not yet measurable: they need the stage 0
; instrumentation (section 14). Until the analyzer reads them, they are "not
; measured" and the overall gate stays INCOMPLETE, as it should.
credit_delay_p95_s = lower 0.05
false_promotion_rate = lower 0.01

; --- Scenario workloads (scripts/workloads/phase_a.py) --------------------------
; Bounds from the workload model (WORKLOADS.md, W5, W6 and section 4), each
; judged per cell (phase) and per path. ALL PROVISIONAL: they become
; pre-registered only after the 12-block pilot of section 15.4. "atmost m a"
; is "<= main x m + a"; "lower v" is "<= main + v"; floor/ceiling are hard
; assertions on the candidate in every judged block.

[workload:llm]
; W5 LLM streaming calls.
*.ttft_net_p50_s = atmost 1.10
*.ttft_net_p95_s = atmost 1.15 0.050
*.lateness_p99_s = atmost 1.10 0.020
*.stalls_per_min = lower 0.2
*.freezes_per_min = lower 0.05
*.call_failures = lower 0.005
; At least 99% of the response's delta bytes sent INTERACTIVE. Needs the
; per-byte class telemetry of WORKLOADS.md R3; until it exists this is not
; measured and the workload's verdict is INCOMPLETE. Expected to fail today
; for prompts of 128 KiB or more (WORKLOADS.md 5.3, F1).
*.class_interactive = floor 0.99

[workload:term]
; W6 terminal keystrokes with 300 KB output bursts.
*.echo_p99_a_s = atmost 1.10 0.020
*.echo_p99_c_s = atmost 1.10 0.020
*.over1s_a = lower 0.002
*.over1s_c = lower 0.002
; Absolute, after the classifier change (WORKLOADS.md 5.4 R1); expected to
; fail before it (F2).
*.latch_ratio = ceiling 1.15
*.sessions_failed = lower 0.05

[workload:mixed]
; M1 (W5 under four downloads) and M2 (W5 under an upload): every
; foreground bound as in its solo workload, against main's mixed run.
*.ttft_net_p50_s = atmost 1.10
*.ttft_net_p95_s = atmost 1.15 0.050
*.lateness_p99_s = atmost 1.10 0.020
*.stalls_per_min = lower 0.2
*.freezes_per_min = lower 0.05
*.call_failures = lower 0.005
*.class_interactive = floor 0.99
; The W6 phase-A canary.
*.canary_echo_p99_s = atmost 1.10 0.020
; The background's own rate (M1 downloads, M2 upload) over the foreground's
; window, so arms whose calls take different times compare like with like;
; a cut upload counts the bytes the sink received. The section 15.4 ratio.
*.bg_rate_bps = atleast 0.90

; --- The minimal live profile (scripts/workloads/minimal.py) ------------------
; Four trial types sized for about 2.5-3 hours of live time per path. The
; bounds are the solo workloads' own (WORKLOADS.md W1, W3, W5, W6, W7, W9),
; applied to the same measure in the mixed trial. ALL PROVISIONAL.

[workload:minimal]
; The model's Minimal live plan (DESIGN-PATH-AUTHORITY.md section 15.3, and
; WORKLOAD-MODEL.md): each trial type's metrics with their provisional
; bounds. The primaries (bulk flows' bytes) are `atleast 0.90`, section
; 15.4's ratio. A tail percentile with fewer than 20 (p95) or 100 (p99)
; samples per arm in a block is tested over every block's samples pooled.
; A, stages 6/7: four downloads, 60 s.
bulk.goodput_bps = atleast 0.90
; B, stages 6/7: W5 loop and W6 keystrokes with one burst, under two downloads.
mixed-67.bg_down_rate_bps = atleast 0.90
mixed-67.ttft_net_p50_s = atmost 1.10
mixed-67.ttft_net_p95_s = atmost 1.15 0.050
mixed-67.lateness_p99_s = atmost 1.10 0.020
mixed-67.stalls_per_min = lower 0.2
mixed-67.freezes_per_min = lower 0.05
mixed-67.call_failures = lower 0.005
; W5 class correctness: at least 99 % of the response's DATA bytes sent
; INTERACTIVE, from the gateway's per-flow class telemetry. Hard.
mixed-67.class_interactive = floor 0.99
; W6: p99 before the burst (A) and after it (C), fraction over 1 s, latch ratio.
mixed-67.echo_p99_a_s = atmost 1.10 0.020
mixed-67.echo_p99_c_s = atmost 1.10 0.020
mixed-67.over1s_a = lower 0.002
mixed-67.over1s_c = lower 0.002
; Absolute; assumes the classifier change (the model's R1).
mixed-67.latch_ratio = ceiling 1.15
; C, stage 10: a call, a page, an LLM call, keystrokes, a download and an
; upload at once; each class judged on its own, the call per direction.
mixed-all.bg_down_rate_bps = atleast 0.90
mixed-all.bg_up_rate_bps = atleast 0.90
mixed-all.ttft_net_p50_s = atmost 1.10
mixed-all.ttft_net_p95_s = atmost 1.15 0.050
mixed-all.lateness_p99_s = atmost 1.10 0.020
mixed-all.stalls_per_min = lower 0.2
mixed-all.freezes_per_min = lower 0.05
mixed-all.call_failures = lower 0.005
mixed-all.class_interactive = floor 0.99
; W6 in C: echo time alone (no bursts).
mixed-all.echo_p99_s = atmost 1.10 0.020
mixed-all.over1s = lower 0.002
; W7, per direction.
mixed-all.call_audio_late_loss_up = lower 0.005
mixed-all.call_audio_late_loss_down = lower 0.005
mixed-all.call_frame_loss_up = lower 0.01
mixed-all.call_frame_loss_down = lower 0.01
mixed-all.call_freezes_per_min_up = lower 0.2
mixed-all.call_freezes_per_min_down = lower 0.2
mixed-all.call_lateness_p99_up_s = atmost 1.10 0.010
mixed-all.call_lateness_p99_down_s = atmost 1.10 0.010
; W3: one h2 page on cold connections.
mixed-all.plt_p50_s = atmost 1.10
mixed-all.plt_p95_s = atmost 1.15 0.100
mixed-all.objects_failed = lower 0.002

[workload:idle-wake]
; D, stage 10: one paired session per path, judged over its wakes (pooled
; samples). Hard: no silent deaths, every wake at 1 and 5 min delivered within
; 5 s. The delivered count at 16 min at least main's (a count, not a test).
; The push and send wake penalty p50 within W9a's bound of main's (unpaired
; bootstrap). p95, max, death modes and idle EOF times are reported.
wake.silent_deaths = ceiling 0
wake.delivered_1m = floor 1.0
wake.delivered_5m = floor 1.0
wake.delivered_16m = nofewer 0
wake.push_penalty_p50_s = atmost 1.10 0.020
wake.send_penalty_p50_s = atmost 1.10 0.020

[workload:impaired]
; Reliability under the frozen impairment scenarios of scripts/ab_impair.py
; (slow-lossy, blackhole, policed), each trial type judged per path. Stalls
; per trial is the [secondary] bound. Goodput is reported, not gated.
; Revised by the lead before the second impaired campaign, from the first
; one's lessons (FROZEN before it; the first campaign keeps the gates it was
; judged by, commit 42728e4):
;
; Event counts are pooled rates, `events v n`: the candidate's failures
; over its opportunities across all blocks, against main's pooled rate + v,
; by an exact binomial test on the candidate's count, together with a
; block-permutation check that the candidate is not worse; at least n
; opportunities per arm. n is the fewest at which a candidate with no event
; can pass against a main with none: (1 - v)^n <= alpha, n = 150 for
; v = 0.02 and alpha 0.05. The impaired trial has 40 LLM calls (4 x 10)
; and 41 sessions, so 4 valid blocks give 160 and 164.
*.call_failures = events 0.02 150
*.silent_rate = events 0.02 150
; Silent deaths (an LLM call or keystroke session the tunnel neither
; delivered nor ended, seen as the client's own timeout): none, in every
; judged block. Hard (the owner's requirement), beside the pooled rate.
*.silent_deaths = ceiling 0
; Flow completion as a pooled event rate (v3, adopted after imp4; imp3 and
; imp4 are not re-judged; effective from the next campaign): failed over
; attempted short downloads (30 of 1 MiB a trial, the window's cut-off ones left out),
; pooled over all blocks, against main's rate + 0.02 by the `events` test
; (exact binomial with the block-permutation check). A per-block t-test on a
; proportion that is often 1.0 failed even when every block favoured the
; candidate (imp4 slow-lossy: 1.0 vs 0.87). At least 149 attempts per arm,
; the fewest at which two arms that never fail can be shown equal at this
; margin ((1 - 0.02)^149 <= 0.05); 6 blocks of 30 give about 180, so a void
; block or a few cut-off downloads still leave 149. Completion itself is
; reported.
*.fetch_failures = events 0.02 149
; TTFT p99 (pooled over blocks when sparse): at most 1.10 x main + 200 ms.
*.ttft_net_p99_s = atmost 1.10 0.200
; Keystroke echo p99: at most 1.10 x main + 50 ms.
*.echo_p99_s = atmost 1.10 0.050
; Per blackhole (the worse of a trial's two outages), from the path's
; restore: the first completed probe, the first byte of a connection opened
; after it, and the first byte again of every flow in flight across it. Each
; at most main's plus 1 s.
blackhole.recover_s = lower 1.0
blackhole.reopen_ttfb_s = lower 1.0
blackhole.inflight_ttfb_s = lower 1.0
; Blackhole TTFT, split (frozen before the second impaired campaign): in the
; first, an LLM turn lined up with the 25 s outage in most blocks, so the
; p99 over all calls reported which arm had a call in flight then. The
; trial's LLM start and outage offsets are now drawn per trial from the
; frozen seed, and the TTFT is judged on the calls clear of the outages (not
; starting or running within one or the 5 s after it) as everywhere else,
; and for the calls caught by an outage from its restore to their first
; token, at most main's plus 1 s like the other restore measures. The p99
; over all calls is reported (ttft_all_p99_s).
blackhole.ttft_clear_p99_s = atmost 1.10 0.200
blackhole.ttft_after_restore_s = lower 1.0
