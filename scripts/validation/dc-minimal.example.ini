; The stage 9 DC gate at its minimal size, as the minimal profile runs it
; (DESIGN-PATH-AUTHORITY.md section 15.3, trial DC; docs/VALIDATING-A-BUNDLE.md,
; "The minimal profile"): 10 transactional requests, ASR and TTS alternating,
; the first on a cold app connection, then 40 s of the sustained-goodput and
; multi-leaf fairness workload, 60 s a trial; 6 blocks, about 5 min each.
; Example stage 9 DC gate campaign for scripts/ab_campaign.py
; (DESIGN-PATH-AUTHORITY.md section 11.3). Copy to a git-ignored
; *.local.ini and fill in your hosts. See docs/VALIDATING-A-BUNDLE.md.
;
; Shape: one temporary gateway per arm with --path-profile dc-long-haul (the
; runner adds it to both ends), several loaded leaves and one control leaf.
; A leaf is an endpoint pair; the gateway is the sender for downloads, so
; its tree is egress -> group -> client address and each client host is one
; leaf under the gateway's shared egress. Pick enough loaded leaves, flows and
; bytes that the shared ancestor binds: the in-block calibration checks it.

[campaign]
name = example-dc-gate
blocks = 6
seed = 20261125
workload = dc
; Sustained phase length; also each solo calibration run.
duration = 40
object_bytes = 268435456
gap = 0
block_gap = 0
snapshot_every = 3
lane_trace = true

[dc]
; Loaded leaves (client sections), each on its own host.
loaded = leaf-a leaf-b leaf-c
; The uncongested sibling: request-sized fetches every control_interval s.
control = leaf-ctl
bulk_flows_per_leaf = 2
; Request phase first: W4 at minimal size on every loaded leaf at once, one
; request at a time, 2 s apart, through wlclient (ASR 355 KB up and 200 B
; back, TTS 300 B up and 300 KB back), served by wlserver on rpc_port and
; rpc_port + 1 on the gateway host.
request_mode = rpc
rpc_requests = 10
rpc_spacing = 2
rpc_port = 23485
; The control leaf's fetches.
request_bytes = 307200
request_timeout = 30
control_interval = 1.0
; Solo runs of each loaded leaf on the legacy arm, at the end of the first
; block only: they stand for every block's ancestor-binding check.
calibrate = first

[gateway]
host = dc-gateway-host
address = 198.51.100.20
platform = linux/amd64
port_base = 23471
metrics_port_base = 23491
origin_port = 23480
flags = --transport auto --max-sessions 4096 --allow-private-destinations

[client:leaf-a]
host = dc-client-a
small = true
[client:leaf-b]
host = dc-client-b
small = true
[client:leaf-c]
host = dc-client-c
small = true
[client:leaf-ctl]
host = dc-client-d
small = true

[arm:legacy]
role = main
ref = origin/main
flags = --bundle=legacy

; Flags are the section 14 switch names; check `queqiaod client -h` on the
; candidate build, since later stages add them. The legacy arm takes no
; switch: dc-long-haul refuses classifier=phased on its legacy bundle.
[arm:pathauth]
role = candidate
ref = origin/main
; dc-long-haul runs the legacy bundle or its whole new-architecture bundle,
; nothing in between (section 11.3, stage 9; the daemon refuses the rest): the
; stage 1-8 switches with classifier=phased, shared on both ends; --topology
; is a client switch and --gateway-admission a gateway switch
; (test_argv_smoke.py starts each role with these). No --topology-fanout:
; recovery=carrier refuses it.
flags = --cc-api=v2 --sched=class --mem=owned --coded-retry=sticky --congestion-scope=path --classifier=phased --recovery=carrier
client_flags = --topology=single
gateway_flags = --gateway-admission=owned

[production:gw]
host = dc-gateway-host
units = queqiaod
ports = 443 19090
[production:a]
host = dc-client-a
units = queqiaod
[production:b]
host = dc-client-b
units = queqiaod
[production:c]
host = dc-client-c
units = queqiaod
[production:d]
host = dc-client-d
units = queqiaod
