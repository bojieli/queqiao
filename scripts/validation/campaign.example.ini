; Example campaign for scripts/ab_campaign.py. Copy it to a git-ignored file
; (anything ending in .local.ini) and fill in your own hosts:
;
;   cp scripts/validation/campaign.example.ini scripts/validation/stage6.local.ini
;
; No real host name or address belongs in a committed file. Hosts are ssh
; destinations (aliases from ~/.ssh/config are best), or "local" for this
; machine. Addresses below are from the documentation ranges (RFC 5737).
; See docs/VALIDATING-A-BUNDLE.md.

[campaign]
; Lowercase letters, digits and hyphens. Every host gets ~/qq-ab-<name>.
name = example-stage6
; Section 15.4 freezes this from a 12-block pilot (ab_analyze.py --pilot).
blocks = 12
; Seeds the ABBA/BAAB choice, so a schedule can be reproduced.
seed = 20261125
; bulk (four concurrent downloads), single (one flow), interactive (bulk plus
; a small-object probe), or dc (the stage 9 workload; see dc.example.ini).
workload = bulk
flows = 4
; Each flow fetches this object with curl --max-time <duration>: the
; outcome is the useful bytes delivered within the duration (section 15.3).
object_bytes = 67108864
duration = 90
probe_bytes = 1024
probe_interval = 0.5
; Seconds between trials, and between blocks.
gap = 5
block_gap = 10
; Re-snapshot production every N blocks and abort on any change.
snapshot_every = 4
lane_trace = true
log_max_mib = 1024
ssh_options = -o ConnectTimeout=20 -o ServerAliveInterval=15

[gateway]
host = gateway-host
; The literal address clients dial. Never a name a local proxy may fake.
address = 192.0.2.10
platform = linux/amd64
; Arm i listens on port_base + i and serves metrics on metrics_port_base + i.
port_base = 23471
metrics_port_base = 23491
; Loopback HTTP origin on the gateway host.
origin_port = 23480
flags = --transport auto --max-sessions 4096 --allow-private-destinations --tcp-fallback-lanes 16 --tcp-congestion bbr

; One section per measured path. "small" hosts never run more than one
; temporary client at a time: each trial starts its arm's client and stops it.
[client:path-a]
host = small-client-host
small = true
platform = linux/amd64
socks_port_base = 23581
metrics_port_base = 23591
flags = --wire-versions 2

[client:path-b]
host = local
small = false
platform = darwin/arm64
socks_port_base = 23581
metrics_port_base = 23591
; Bind the outer socket to the physical interface so a TUN-mode proxy does
; not carry the test (docs/BENCHMARKING.md, "Live campaigns").
flags = --wire-versions 2 --local-address if:en0

; Arms: a git ref built locally for every platform above, or prebuilt
; binaries as binary_<os>_<arch> = PATH. flags apply to both endpoints,
; gateway_flags and client_flags to one.
[arm:main]
role = main
ref = origin/main

[arm:cand]
role = candidate
ref = origin/feat/stage6-path-controller
flags = --cc-api=v2 --sched=class --congestion=path

; Every host above must appear in a production section, even with nothing in
; it. The runner refuses to start if a planned port is declared here or is
; already listening, and aborts if any unit, launchd job, or process matching
; process_pattern changes during the campaign.
[production:gateway]
host = gateway-host
units = queqiaod
; Include the whole hop-port range of a production gateway.
ports = 443 12540-12639 19090
process_pattern = queqiao

[production:small-client]
host = small-client-host
units = queqiao-relay-1 queqiao-relay-2
process_pattern = queqiao|mihomo

[production:local]
host = local
launchd = com.example.queqiao.client
process_pattern = queqiao
