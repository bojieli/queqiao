; The minimal live profile, trial types A, B and C (scripts/workloads/minimal.py).
; Copy to a git-ignored *.local.ini, one per path, and fill in your hosts.
; Run idle-wake.example.ini (D) and dc-minimal.example.ini (stage 9) as
; well; `ab_campaign.py --dry-run` prints each one's estimated wall time.
;
; The gateway host is one of the two shared proxy hosts (ssh aliases
; proxy-a and proxy-b). Temporary gateways run there on their own ports
; beside the production queqiaod.service, which the runner never stops,
; restarts or reconfigures: it refuses to start on any declared production
; port or path, and checks the unit is untouched before, during and after.

[campaign]
name = minimal-path-a
; Sequential stopping: looks after blocks 6..12, stop once every gate is
; decided (Haybittle-Peto: interim alpha 0.001, final 0.044).
sequential = true
first_blocks = 6
blocks = 12
interim_alpha = 0.001
seed = 20261125
workload = minimal
; The downloads' object; flows fetch object after object for the window.
object_bytes = 268435456
gap = 5
block_gap = 10
snapshot_every = 3
lane_trace = true

[workload:minimal]
bulk_seconds = 60
mixed67_seconds = 90
mixedall_seconds = 120
upload_kb = 100
server_port = 23485
term_port = 23486
udp_port = 23487
tls = true

[gateway]
host = proxy-a
; The literal address clients dial (documentation range here).
address = 192.0.2.10
platform = linux/amd64
port_base = 23471
metrics_port_base = 23491
origin_port = 23480
flags = --transport auto --max-sessions 4096 --allow-private-destinations --tcp-fallback-lanes 16 --tcp-congestion bbr

[client:path-a]
host = small-client-host
small = true
platform = linux/amd64
flags = --wire-versions 2

[arm:main]
role = main
ref = origin/main

[arm:cand]
role = candidate
ref = origin/feat/stage7-topology-single
flags = --cc-api=v2 --sched=class --congestion=path --topology=single

[production:proxy-a]
host = proxy-a
units = queqiaod
; The production gateway's listener with its whole hop-port range, and its
; metrics port.
ports = 443 12540-12639 19090
; Its binary, state and logs: no flag may name them.
paths = /usr/local/bin/queqiaod /var/lib/queqiao /var/log/queqiao /etc/queqiao
process_pattern = queqiao

[production:small-client]
host = small-client-host
units = queqiao-relay-1
