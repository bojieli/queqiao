; The minimal live profile: trial types A, B and C, and D beside them
; (scripts/workloads/minimal.py; DESIGN-PATH-AUTHORITY.md section 15.3).
; Copy to a git-ignored *.local.ini, one per path, and fill in your hosts.
; Each trial type runs once per path, at its gate: `trials = bulk, mixed-67`
; at stages 6/7, `trials = mixed-all` at stage 10 (D runs beside it), and
; dc-minimal.example.ini at stage 9. A pass carries forward to the flip
; unless a later stage changes what the trial exercises.
; `ab_campaign.py --dry-run` prints the estimated wall time.
;
; The gateway host is one of the two shared proxy hosts (ssh aliases
; proxy-a and proxy-b). Temporary gateways run there on their own ports
; beside the production queqiaod.service, which the runner never stops,
; restarts or reconfigures: it refuses to start on any declared production
; port or path, and checks the unit is untouched before, during and after.

[campaign]
name = minimal-path-a
; Sequential stopping (section 15.4): looks after blocks 6..12, each trial
; type stopped on its own once decided, at nominal levels from the
; Pocock-type alpha-spending function with total one-sided alpha 0.05
; (spending = bonferroni: 0.05/7 per look). Undecided at 12 blocks fails.
sequential = true
first_blocks = 6
blocks = 12
alpha = 0.05
spending = pocock
seed = 20261125
workload = minimal
; The downloads' object; flows fetch object after object for the window.
object_bytes = 268435456
; The per-block restarts are in the estimate; no extra pause between trials.
gap = 0
block_gap = 0
snapshot_every = 3
lane_trace = true
; Sample each loaded host's CPU (and production's) through every trial; a
; block where production or the hypervisor contended is void, and each arm's
; CPU is reported (gates.ini [contention]).
host_cpu = true

[workload:minimal]
; The trial types this campaign runs, each a block of its own, round-robin.
; Their settings are fixed by the model's minimal live plan.
trials = bulk, mixed-67, mixed-all
; D (idle wake) beside the blocks: auto runs it with mixed-all, during C's
; first two blocks; true also runs it beside A and B (the classifier=v2 gate).
idle_wake = auto
; D's two idle client instances share the path's small client host.
idle_wake_on_small = true
server_port = 23485
term_port = 23486
udp_port = 23487
wake_port = 23488
tls = true

[gateway]
host = proxy-a
; The literal address clients dial (documentation range here).
address = 192.0.2.10
platform = linux/amd64
port_base = 23471
metrics_port_base = 23491
origin_port = 23480
flags = --transport auto --max-sessions 4096 --allow-private-destinations --tcp-fallback-lanes 16 --tcp-congestion bbr

[client:path-a]
host = small-client-host
small = true
platform = linux/amd64
flags = --wire-versions 2

[arm:main]
role = main
ref = origin/main
flags = --classifier=phased

[arm:cand]
role = candidate
ref = origin/main
; The stage 1-7 bundle: shared switches on both ends; --topology is a client
; switch and --gateway-admission a gateway switch (test_argv_smoke.py starts
; each role with these to catch a wrong flag before a campaign does).
flags = --cc-api=v2 --sched=class --mem=owned --coded-retry=sticky --congestion-scope=path --classifier=phased
client_flags = --topology=single
gateway_flags = --gateway-admission=owned

[production:proxy-a]
host = proxy-a
units = queqiaod
; When the ssh user cannot read the unit's executable (it runs as another
; user), the snapshot -- and nothing else -- may read it through sudo -n.
; snapshot_sudo = true
; The production gateway's listener with its whole hop-port range, and its
; metrics port.
ports = 443 12540-12639 19090
; Its binary, state and logs: no flag may name them.
paths = /usr/local/bin/queqiaod /var/lib/queqiao /var/log/queqiao /etc/queqiao
process_pattern = queqiao

[production:small-client]
host = small-client-host
units = queqiao-relay-1
